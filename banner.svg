<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="William Sánchez" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="0.65" stop-color="#1B2550"/>
      <stop offset="1" stop-color="#3B2E6E"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0B1020" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#0B1020" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#0B1020" stop-opacity="0.75"/>
    </linearGradient>
    <clipPath id="c"><rect width="1200" height="300" rx="14"/></clipPath>
  </defs>
  <style>
    .title { font: 900 78px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #FFFFFF; letter-spacing: 1px; }
    .sub   { font: 500 17px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #CBD5E1; }
    .star  { animation: tw 3s ease-in-out infinite; }
    .s2 { animation-delay: 1s; } .s3 { animation-delay: 2s; }
    @keyframes tw { 50% { opacity: 0.2; } }
    .win { animation: tw 4s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { .star, .win { animation: none; } }
  </style>
  <g clip-path="url(#c)">
    <rect width="1200" height="300" fill="url(#sky)"/>
    <!-- estrellas -->
    <g fill="#E2E8F0">
      <circle class="star" cx="60" cy="40" r="1.6"/><circle class="star s2" cx="180" cy="80" r="1.2"/>
      <circle class="star s3" cx="300" cy="30" r="1.4"/><circle class="star" cx="420" cy="70" r="1"/>
      <circle class="star s2" cx="530" cy="25" r="1.5"/><circle class="star s3" cx="650" cy="55" r="1.1"/>
      <circle class="star" cx="760" cy="20" r="1.3"/><circle class="star s2" cx="880" cy="60" r="1"/>
      <circle class="star s3" cx="990" cy="35" r="1.5"/><circle class="star" cx="1120" cy="75" r="1.2"/>
      <circle class="star s2" cx="240" cy="130" r="1"/><circle class="star s3" cx="1060" cy="140" r="1"/>
    </g>
    <!-- luna -->
    <mask id="moon"><rect width="1200" height="300" fill="#fff"/><circle cx="152" cy="62" r="24" fill="#000"/></mask>
    <circle cx="140" cy="70" r="26" fill="#F8FAFC" opacity="0.9" mask="url(#moon)"/>

    <!-- cerros orientales con Monserrate -->
    <path d="M0 210 L80 175 L150 190 L230 140 L290 120 L330 95 L360 118 L430 150 L520 135 L600 165 L700 150 L800 175 L900 160 L1000 185 L1100 170 L1200 190 L1200 300 L0 300Z" fill="#232C5C"/>
    <rect x="322" y="82" width="16" height="14" fill="#E2E8F0" opacity="0.85"/>
    <path d="M320 82 L330 72 L340 82Z" fill="#E2E8F0" opacity="0.85"/>
    <path d="M0 235 L120 215 L260 225 L380 205 L520 222 L700 210 L880 228 L1040 215 L1200 225 L1200 300 L0 300Z" fill="#1A2149"/>

