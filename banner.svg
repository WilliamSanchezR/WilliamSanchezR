      <rect x="135" y="245" width="60" height="55"/><rect x="200" y="210" width="40" height="90"/>
      <rect x="245" y="240" width="55" height="60"/><rect x="305" y="225" width="35" height="75"/>
      <rect x="345" y="250" width="70" height="50"/><rect x="420" y="215" width="45" height="85"/>
      <rect x="470" y="160" width="34" height="140"/><rect x="510" y="235" width="60" height="65"/>
      <rect x="575" y="220" width="40" height="80"/><rect x="620" y="245" width="70" height="55"/>
      <rect x="695" y="205" width="45" height="95"/><rect x="745" y="238" width="55" height="62"/>
      <rect x="805" y="222" width="40" height="78"/><rect x="850" y="248" width="70" height="52"/>
      <rect x="925" y="212" width="45" height="88"/><rect x="975" y="236" width="60" height="64"/>
      <rect x="1040" y="225" width="40" height="75"/><rect x="1085" y="245" width="75" height="55"/>
      <rect x="1165" y="230" width="35" height="70"/>
    </g>
    <!-- torre alta -->
    <rect x="486" y="146" width="2" height="14" fill="#0E1430"/>
