      <rect class="win s2" x="476" y="215" width="5" height="5"/><rect x="492" y="245" width="5" height="5"/>
      <rect x="104" y="235" width="4" height="4"/><rect class="win s3" x="210" y="230" width="4" height="4"/>
      <rect x="430" y="232" width="4" height="4"/><rect class="win" x="585" y="238" width="4" height="4"/>
      <rect x="708" y="222" width="4" height="4"/><rect class="win s2" x="815" y="240" width="4" height="4"/>
      <rect x="936" y="228" width="4" height="4"/><rect class="win s3" x="1050" y="242" width="4" height="4"/>
      <rect x="256" y="258" width="4" height="4"/><rect x="760" y="255" width="4" height="4"/>
