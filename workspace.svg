<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="400" height="480" role="img" aria-label="Escritorio de programador de noche" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="room" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151B3A"/><stop offset="1" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B2550"/><stop offset="1" stop-color="#4B3A82"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.35"/><stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lampglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FBBF24" stop-opacity="0.35"/><stop offset="1" stop-color="#FBBF24" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="c"><rect width="400" height="480" rx="14"/></clipPath>
    <clipPath id="w"><rect x="40" y="40" width="210" height="230"/></clipPath>
  </defs>
  <style>
    .code { animation: type 6s steps(1) infinite; }
    .c2 { animation-delay: .8s; } .c3 { animation-delay: 1.6s; } .c4 { animation-delay: 2.4s; } .c5 { animation-delay: 3.2s; }
    @keyframes type { 0% { opacity: 0; } 15% { opacity: 1; } 95% { opacity: 1; } }
    .cur { animation: blink 1s step-end infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .code, .cur { animation: none; } }
  </style>
  <g clip-path="url(#c)">
    <rect width="400" height="480" fill="url(#room)"/>

    <!-- ventana -->
    <rect x="34" y="34" width="222" height="242" fill="#0A0F22"/>
    <g clip-path="url(#w)">
      <rect x="40" y="40" width="210" height="230" fill="url(#night)"/>
      <path d="M40 210 L90 185 L130 150 L150 140 L170 160 L210 175 L250 168 L250 270 L40 270Z" fill="#232C5C"/>
      <g fill="#0E1430">
        <rect x="45" y="225" width="30" height="45"/><rect x="80" y="205" width="22" height="65"/>
        <rect x="106" y="230" width="35" height="40"/><rect x="146" y="195" width="20" height="75"/>
        <rect x="170" y="225" width="35" height="45"/><rect x="210" y="212" width="38" height="58"/>
      </g>
      <g fill="#FBBF24"><rect x="86" y="215" width="3" height="3"/><rect x="152" y="210" width="3" height="3"/>
        <rect x="220" y="225" width="3" height="3"/><rect x="118" y="240" width="3" height="3"/></g>
      <circle cx="210" cy="80" r="14" fill="#F8FAFC" opacity="0.9"/>
      <!-- persiana -->
      <g stroke="#0D1117" stroke-opacity="0.55" stroke-width="5">
        <line x1="40" y1="52" x2="250" y2="52"/><line x1="40" y1="68" x2="250" y2="68"/>
        <line x1="40" y1="84" x2="250" y2="84"/><line x1="40" y1="100" x2="250" y2="100"/>
        <line x1="40" y1="116" x2="250" y2="116"/><line x1="40" y1="132" x2="250" y2="132"/>
      </g>
    </g>
    <line x1="145" y1="40" x2="145" y2="270" stroke="#0A0F22" stroke-width="5"/>

    <!-- planta -->
    <rect x="282" y="245" width="90" height="6" rx="2" fill="#3B2E6E"/>
    <rect x="300" y="215" width="34" height="30" rx="4" fill="#7C3AED"/>
    <path d="M317 215 C300 190 290 175 296 160 C308 175 314 195 317 215Z" fill="#34D399"/>
    <path d="M317 215 C330 185 345 172 350 160 C352 182 335 200 317 215Z" fill="#10B981"/>
    <path d="M317 215 C316 190 318 170 322 150 C328 175 324 198 317 215Z" fill="#34D399"/>

    <!-- escritorio -->
    <rect x="0" y="330" width="400" height="16" fill="#3B2E6E"/>
    <rect x="0" y="346" width="400" height="134" fill="#0B0F1E"/>

    <!-- lámpara -->
    <circle cx="350" cy="300" r="70" fill="url(#lampglow)"/>
    <rect x="340" y="320" width="26" height="10" rx="3" fill="#475569"/>
    <line x1="353" y1="320" x2="335" y2="282" stroke="#475569" stroke-width="4"/>
    <path d="M320 280 L350 270 L356 290 Z" fill="#FBBF24"/>

    <!-- monitor -->
    <circle cx="170" cy="275" r="130" fill="url(#glow)"/>
    <rect x="85" y="215" width="190" height="112" rx="8" fill="#1E293B"/>
    <rect x="93" y="223" width="174" height="96" rx="4" fill="#0A131D"/>
    <g font-family="Consolas, 'Courier New', monospace" font-size="10">
      <text class="code" x="102" y="240" fill="#38BDF8">@app.get("/")</text>
      <text class="code c2" x="102" y="256" fill="#C084FC">def <tspan fill="#E6EDF3">root</tspan>():</text>
      <text class="code c3" x="114" y="272" fill="#C084FC">return <tspan fill="#FBBF24">{"ok": True}</tspan></text>
      <text class="code c4" x="102" y="290" fill="#34D399">$ uvicorn main:app</text>
      <text class="code c5" x="102" y="306" fill="#94A3B8">running on :8000<tspan class="cur" fill="#38BDF8"> ▍</tspan></text>
    </g>
    <rect x="168" y="327" width="24" height="5" fill="#334155"/>

    <!-- teclado y taza -->
    <rect x="110" y="338" width="130" height="8" rx="3" fill="#334155"/>
    <rect x="262" y="314" width="22" height="18" rx="3" fill="#F8FAFC"/>
    <path d="M284 318 Q294 323 284 328" fill="none" stroke="#F8FAFC" stroke-width="3"/>
    <path d="M268 308 Q272 300 268 292 M276 308 Q280 300 276 292" stroke="#94A3B8" stroke-width="1.5" fill="none" opacity="0.6"/>

    <!-- silla y persona (silueta) -->
    <circle cx="40" cy="300" r="22" fill="#0B0F1E"/>
    <path d="M5 480 L5 360 Q10 325 40 322 Q75 325 80 360 L80 480Z" fill="#0B0F1E"/>
    <path d="M70 352 Q100 340 118 336" stroke="#0B0F1E" stroke-width="12" stroke-linecap="round" fill="none"/>
  </g>
</svg>
